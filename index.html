<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Library - freudian</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- DFlip CSS -->
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 43, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(56, 189, 248, 0.4);
      --accent-cyan: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --gold-star: #fbbf24;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.88) 0%, rgba(9, 13, 22, 0.95) 100%), 
                  url('img/bg-web.png') center/cover fixed no-repeat #090d16;
      color: var(--text-primary);
      margin: 0;
      padding-top: 100px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar Glassmorphism Sleek */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(9, 13, 22, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 6%;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000;
    }

    .brand { 
      font-size: 1.35rem; font-weight: 800; color: #ffffff; 
      display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px;
      cursor: pointer;
    }
    
    .brand i { color: var(--accent-cyan); font-size: 1.4rem; filter: drop-shadow(0 0 8px var(--accent-glow)); }

    /* Group Bagian Kanan Navbar */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .search-box { position: relative; display: flex; align-items: center; }
    
    .search-box input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      padding: 9px 18px 9px 40px; border-radius: 30px;
      width: 220px; outline: none; font-size: 0.85rem;
      font-family: inherit; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-box i {
      position: absolute; left: 15px; color: var(--text-secondary); font-size: 0.85rem;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      width: 250px;
    }

    /* User Profile Pill */
    .user-profile-wrapper {
      position: relative;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 14px 5px 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .user-profile:hover, .user-profile.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent-cyan);
    }

    .user-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .user-profile i.fa-chevron-down {
      font-size: 0.75rem;
      color: var(--text-secondary);
      transition: transform 0.3s ease;
    }

    .user-profile.active i.fa-chevron-down {
      transform: rotate(180deg);
    }

    /* Dropdown Profile Menu */
    .profile-dropdown {
      position: absolute;
      top: 52px;
      right: 0;
      width: 240px;
      background: rgba(18, 26, 43, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border-hover);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 1001;
      animation: dropdownFade 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .profile-dropdown.show {
      display: flex;
    }

    @keyframes dropdownFade {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .dropdown-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
    }

    .dropdown-user-info .name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #ffffff;
      margin: 0;
    }

    .dropdown-user-info .bio {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin: 3px 0 0 0;
      font-weight: 500;
      font-style: italic;
    }

    .dropdown-menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .dropdown-item div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item i {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      width: 18px;
    }

    .dropdown-item:hover {
      background: rgba(56, 189, 248, 0.12);
      color: #ffffff;
      transform: translateX(3px);
    }

    .fav-count-badge {
      background: var(--gold-star);
      color: #090d16;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Filter Bar Pills Modern */
    .filter-container {
      padding: 15px 5% 25px;
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
      max-width: 1000px; margin: 0 auto;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 22px; border-radius: 30px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: capitalize; font-family: inherit;
    }

    .filter-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #090d16; font-weight: 700; 
      border-color: transparent; 
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
    }

    /* Grid Catalog Buku Horizontal */
    .book-grid {
      display: grid; grid-template-columns: 1fr; gap: 30px;
      padding: 10px 5% 60px; max-width: 950px; margin: 0 auto;
    }

    .book-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px; border: 1px solid var(--card-border);
      display: flex; overflow: hidden; position: relative;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .book-card:hover {
      transform: translateY(-5px);
      border-color: var(--card-border-hover);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.12);
    }

    .cover-wrapper {
      width: 210px; height: 290px; flex-shrink: 0; overflow: hidden; position: relative;
    }

    .cover-wrapper img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s ease;
    }

    .book-card:hover .cover-wrapper img {
      transform: scale(1.05);
    }

    .badge-popular {
      position: absolute; top: 14px; left: 14px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #090d16; font-size: 0.68rem; font-weight: 800;
      padding: 5px 12px; border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .book-details {
      padding: 30px 32px; flex-grow: 1;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .book-title { 
      font-size: 1.6rem; font-weight: 800; margin: 0 0 12px 0; 
      color: #ffffff; letter-spacing: -0.5px;
    }

    .book-synopsis {
      color: var(--text-secondary); font-size: 0.92rem; line-height: 1.65; margin: 0 0 20px 0;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      font-weight: 400;
    }

    .book-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 22px; border-top: 1px solid var(--card-border); padding-top: 16px;
    }

    .genre-badges { display: flex; gap: 8px; flex-wrap: wrap; }

    .badge {
      font-size: 0.7rem; font-weight: 700;
      background: rgba(56, 189, 248, 0.12); color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 5px 14px; border-radius: 20px; text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .upload-date { color: var(--text-secondary); font-size: 0.82rem; display: flex; align-items: center; gap: 6px; }

    /* Action Container & Favorite Button */
    .book-action {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .book-action ._df_button {
      display: inline-flex !important; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%) !important; 
      color: #090d16 !important; font-weight: 800 !important; font-size: 0.9rem !important;
      padding: 12px 28px !important; border-radius: 14px !important;
      cursor: pointer; border: none !important;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35) !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      font-family: inherit !important; text-transform: none !important;
    }

    .book-action ._df_button:hover {
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.55) !important;
      transform: translateY(-2px) scale(1.02);
      color: #ffffff !important;
    }

    .btn-fav-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      width: 45px; height: 45px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s ease;
      font-size: 1.1rem;
    }

    .btn-fav-toggle:hover {
      background: rgba(251, 191, 36, 0.15);
      color: var(--gold-star);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .btn-fav-toggle.is-fav {
      background: rgba(251, 191, 36, 0.2);
      color: var(--gold-star);
      border-color: var(--gold-star);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
    }

    /* GRID COVERS ONLY (HANYA COVER UNTUK LIBRARY/FAVORIT) */
    .book-grid.covers-only {
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .book-grid.covers-only .book-card {
      flex-direction: column;
      border-radius: 18px;
    }

    .book-grid.covers-only .cover-wrapper {
      width: 100%; height: 280px;
    }

    .book-grid.covers-only .book-details {
      padding: 16px;
    }

    .book-grid.covers-only .book-synopsis,
    .book-grid.covers-only .book-meta {
      display: none !important;
    }

    .book-grid.covers-only .book-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* FIX FLOATING TOOLBAR DFLIP DI BAWAH */
    .df-lightbox-wrapper,
    .df-lightbox-container,
    .df-container {
      background: rgba(9, 13, 22, 0.94) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
    }

    .df-ui-controls {
      position: absolute !important;
      bottom: 20px !important;
      top: auto !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 99999 !important;

      background: rgba(18, 26, 43, 0.85) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 40px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15) !important;
      height: 48px !important;
      line-height: 48px !important;
      padding: 0 16px !important;
      margin: 0 !important;
      width: fit-content !important;
      min-width: unset !important;
      max-width: 90vw !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .df-ui-controls .df-ui-btn,
    .df-ui-controls .df-ui-prev,
    .df-ui-controls .df-ui-next,
    .df-ui-controls .df-ui-zoom,
    .df-ui-controls .df-ui-page {
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      float: left !important;
      height: 36px !important;
      line-height: 36px !important;
      margin: 0 2px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .df-ui-btn {
      color: var(--text-primary) !important;
      background: transparent !important;
      border-radius: 50% !important;
      width: 36px !important;
      transition: all 0.2s ease !important;
      opacity: 0.8;
    }

    .df-ui-btn:hover {
      color: var(--accent-cyan) !important;
      background: rgba(56, 189, 248, 0.15) !important;
      opacity: 1 !important;
    }

    .df-ui-page-input, .df-ui-page {
      color: var(--accent-cyan) !important;
      font-weight: 700 !important;
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 4px !important;
    }

    @media (max-width: 680px) {
      .navbar { padding: 12px 4%; }
      .book-card { flex-direction: column; }
      .cover-wrapper { width: 100%; height: 250px; }
      .book-meta { flex-direction: column; align-items: flex-start; gap: 14px; }
      .search-box input { width: 130px; }
      .search-box input:focus { width: 150px; }
      .user-name { display: none; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand" onclick="window.filterGenre('all')"><i class="fa-solid fa-book-open"></i> flipbookbyalonica</div>
    
    <div class="nav-right">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" onkeyup="window.searchBuku()" placeholder="Cari judul...">
      </div>

      <!-- User Profile Dropdown Component -->
      <div class="user-profile-wrapper">
        <div class="user-profile" id="userProfileBtn">
          <img src="img/profile.png" alt="User Avatar" class="user-avatar" id="navUserAvatar">
          <span class="user-name" id="navUserName">freudian</span>
          <i class="fa-solid fa-chevron-down"></i>
        </div>

        <!-- Menu Dropdown -->
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-header">
            <img src="img/profile.png" alt="User Avatar" class="dropdown-avatar" id="dropdownUserAvatar">
            <div class="dropdown-user-info">
              <p class="name" id="dropdownUserName">freudian</p>
              <p class="bio">honey, there's the door</p>
            </div>
          </div>

          <ul class="dropdown-menu-list">
            <li class="dropdown-item" onclick="window.showLibraryOnly()">
              <div><i class="fa-solid fa-bookmark"></i> Library Saya</div>
            </li>
            <li class="dropdown-item" onclick="window.showFavoritesOnly()">
              <div><i class="fa-solid fa-star"></i> Buku Favorit</div>
              <span class="fav-count-badge" id="favBadge">0</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Filter Genre Dinamis -->
  <div class="filter-container" id="filterContainer"></div>

  <!-- Grid Catalog Buku -->
  <div class="book-grid" id="bookGrid"></div>

  <!-- Scripts External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

  <!-- Script Aplikasi Utama -->
  <script>
    const daftarBuku = [
      {
        judul: "Boune City",
        file: "books/boune-city.pdf",
        cover: "img/boune-city-cover.png",
        genre: ["city", "action", "mystery", "crime"],
        deskripsi: "Lima tahun setelah kasus misterius berlalu, Jagad kembali ke Damn Boune dan menemukan petunjuk baru tentang kematian tiga pejabat serta korupsi yang tersembunyi. Bersama Arken, Cendy, dan Akbar, ia berusaha mengungkap dalang di balik semuanya sebelum kebenaran kembali terkubur.",
        tanggal: "1 Sep 2026",
        isPopuler: true
      },
      {
        judul: "Satu Langkah Lagi",
        file: "books/satu-langkah-lagi.pdf",
        cover: "img/satu-langkah-lagi-cover.png",
        genre: ["romance", "drama"],
        deskripsi: "Di tengah senja di tepi pantai, dua sahabat kembali bertemu setelah sekian lama menjalani kesibukan masing-masing. Pertemuan sederhana itu membawa mereka mengingat berbagai kenangan yang pernah dilalui bersama. Sambil menikmati indahnya matahari terbenam, mereka menyadari bahwa terkadang untuk melangkah maju, seseorang hanya perlu satu langkah lagi.",
        tanggal: "2 Sep 2026",
        isPopuler: false
      }
    ];

    let currentFilter = 'all';

    function getFavoritList() {
      const saved = localStorage.getItem('user_favorites');
      return saved ? JSON.parse(saved) : [];
    }

    function updateFavBadge() {
      const favs = getFavoritList();
      const badge = document.getElementById('favBadge');
      if (badge) badge.textContent = favs.length;
    }

    window.toggleFavorit = function(judul) {
      let favs = getFavoritList();
      if (favs.includes(judul)) {
        favs = favs.filter(j => j !== judul);
      } else {
        favs.push(judul);
      }
      localStorage.setItem('user_favorites', JSON.stringify(favs));
      updateFavBadge();
      
      if (currentFilter === 'favorites') {
        window.showFavoritesOnly();
      } else if (currentFilter === 'library') {
        window.showLibraryOnly();
      } else {
        renderBuku(daftarBuku);
      }
    };

    function updateFilterButtons() {
      const container = document.getElementById('filterContainer');
      if (!container) return;

      let allGenres = new Set();
      daftarBuku.forEach(buku => {
        if (Array.isArray(buku.genre)) {
          buku.genre.forEach(g => allGenres.add(g.toLowerCase().trim()));
        }
      });

      let html = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="window.filterGenre('all')">Semua</button>`;
      allGenres.forEach(genre => {
        html += `<button class="filter-btn ${currentFilter === genre ? 'active' : ''}" onclick="window.filterGenre('${genre}')">${genre}</button>`;
      });
      
      container.innerHTML = html;
    }

    function renderBuku(bukuList, isCoversOnly = false) {
      const grid = document.getElementById('bookGrid');
      if (!grid) return;
      
      grid.innerHTML = "";
      
      if (isCoversOnly) {
        grid.classList.add('covers-only');
      } else {
        grid.classList.remove('covers-only');
      }

      if (bukuList.length === 0) {
        grid.innerHTML = `<p style="text-align:center; color:var(--text-secondary); padding:40px; grid-column:1/-1;">Belum ada buku di kategori ini...</p>`;
        return;
      }

      const favs = getFavoritList();

      bukuList.forEach((buku) => {
        const badges = (buku.genre || []).map(g => `<span class="badge">${g}</span>`).join('');
        const imgCover = buku.cover || 'img/boune-city-cover.png';
        const synopsis = buku.deskripsi || 'Tidak ada sinopsis.';
        const dateStr = buku.tanggal || '1 Sep 2026';
        const popularBadge = buku.isPopuler ? `<div class="badge-popular">⭐ Populer</div>` : '';
        const isFav = favs.includes(buku.judul);

        const card = `
          <div class="book-card">
            <div class="cover-wrapper">
              ${popularBadge}
              <img src="${imgCover}" alt="${buku.judul}" onerror="this.src='https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=600&auto=format&fit=crop'">
            </div>
            
            <div class="book-details">
              <div>
                <h3 class="book-title">${buku.judul}</h3>
                <p class="book-synopsis">${synopsis}</p>
                
                <div class="book-meta">
                  <div class="genre-badges">${badges}</div>
                  <div class="upload-date">
                    <i class="fa-regular fa-calendar-days"></i> Uploaded: ${dateStr}
                  </div>
                </div>
              </div>
              
              <div class="book-action">
                <div class="_df_button btn-read-flip" source="${buku.file}">Baca Flipbook</div>
                <button class="btn-fav-toggle ${isFav ? 'is-fav' : ''}" onclick="window.toggleFavorit('${buku.judul}')" title="Favoritkan Buku">
                  <i class="fa-${isFav ? 'solid' : 'regular'} fa-star"></i>
                </button>
              </div>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });

      updateFilterButtons();
      updateFavBadge();
    }

    window.filterGenre = function(genre) {
      currentFilter = genre;
      if (genre === 'all') {
        renderBuku(daftarBuku);
      } else {
        const filtered = daftarBuku.filter(b => 
          Array.isArray(b.genre) && b.genre.map(g => g.toLowerCase()).includes(genre)
        );
        renderBuku(filtered);
      }
    };

    window.showLibraryOnly = function() {
      currentFilter = 'library';
      renderBuku(daftarBuku, true);
      const dropdown = document.getElementById('profileDropdown');
      if (dropdown) dropdown.classList.remove('show');
    };

    window.showFavoritesOnly = function() {
      currentFilter = 'favorites';
      const favs = getFavoritList();
      const filtered = daftarBuku.filter(b => favs.includes(b.judul));
      renderBuku(filtered, true);
      const dropdown = document.getElementById('profileDropdown');
      if (dropdown) dropdown.classList.remove('show');
    };

    window.searchBuku = function() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = daftarBuku.filter(b => 
        b.judul.toLowerCase().includes(q) || 
        (Array.isArray(b.genre) && b.genre.some(g => g.toLowerCase().includes(q)))
      );
      renderBuku(filtered);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const defaultUsername = "freudian";
      const defaultAvatar = "img/profile.png"; 

      const activeUsername = localStorage.getItem('username') || defaultUsername;
      const activeAvatar = localStorage.getItem('userAvatar') || defaultAvatar;

      document.getElementById('navUserName').textContent = activeUsername;
      document.getElementById('dropdownUserName').textContent = activeUsername;
      
      const navAvatarImg = document.getElementById('navUserAvatar');
      const dropAvatarImg = document.getElementById('dropdownUserAvatar');
      const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(activeUsername)}&background=38bdf8&color=090d16`;

      navAvatarImg.src = activeAvatar;
      dropAvatarImg.src = activeAvatar;

      navAvatarImg.onerror = () => { navAvatarImg.src = fallbackAvatar; };
      dropAvatarImg.onerror = () => { dropAvatarImg.src = fallbackAvatar; };

      renderBuku(daftarBuku);
      updateFavBadge();
    });

    const profileBtn = document.getElementById('userProfileBtn');
    const dropdown = document.getElementById('profileDropdown');

    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileBtn.classList.toggle('active');
      dropdown.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
      if (!profileBtn.contains(e.target) && !dropdown.contains(e.target)) {
        profileBtn.classList.remove('active');
        dropdown.classList.remove('show');
      }
    });
  </script>

</body>
</html>
