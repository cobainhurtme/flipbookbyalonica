<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Library Pro - Alonica</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- DFlip CSS -->
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.88);
      --card-bg: rgba(30, 41, 59, 0.8);
      --accent: #38bdf8;
      --gold: #fbbf24;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                  url('img/bg-web.png') center/cover fixed no-repeat #0f172a;
      color: var(--text);
      margin: 0;
      padding-top: 90px;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 15px 5%;
      display: flex; justify-content: space-between; align-items: center;
      box-sizing: border-box; z-index: 1000;
    }

    .brand { font-size: 1.4rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .nav-actions { display: flex; gap: 15px; align-items: center; }

    .search-box input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px; border-radius: 30px;
      width: 220px; outline: none; font-size: 0.9rem;
    }

    .btn-add-book {
      background: var(--accent); color: #0f172a; border: none;
      padding: 10px 18px; border-radius: 30px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
    }

    /* Filter Bar Dinamis */
    .filter-container {
      padding: 10px 5%;
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
      max-width: 1000px; margin: 0 auto;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 16px; border-radius: 20px;
      cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
      text-transform: capitalize;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent); color: #0f172a; font-weight: 700; border-color: var(--accent);
    }

    /* Grid Catalog Buku Horizontal */
    .book-grid {
      display: grid; grid-template-columns: 1fr; gap: 25px;
      padding: 20px 5% 50px; max-width: 1000px; margin: 0 auto;
    }

    .book-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 16px; border: 1px solid var(--border);
      display: flex; overflow: hidden; position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .book-card:hover {
      transform: translateX(5px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
    }

    .cover-wrapper {
      width: 180px; height: 260px; flex-shrink: 0; overflow: hidden; position: relative;
    }

    .cover-wrapper img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .badge-popular {
      position: absolute; top: 10px; left: 10px;
      background: var(--gold); color: #0f172a;
      font-size: 0.65rem; font-weight: 800;
      padding: 4px 8px; border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-transform: uppercase;
    }

    .book-details {
      padding: 25px; flex-grow: 1;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .book-title { font-size: 1.4rem; font-weight: 700; margin: 0 0 12px 0; color: white; }

    .book-synopsis {
      color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin: 0 0 15px 0;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    .book-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; border-top: 1px solid var(--border); padding-top: 12px;
    }

    .genre-badges { display: flex; gap: 6px; flex-wrap: wrap; }

    .badge {
      font-size: 0.7rem; font-weight: 700;
      background: rgba(56, 189, 248, 0.15); color: var(--accent);
      padding: 4px 10px; border-radius: 20px; text-transform: uppercase;
    }

    .upload-date { color: var(--text-muted); font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }

    .book-action-bar {
      display: flex; justify-content: space-between; align-items: center;
    }

    .book-action ._df_button {
      display: inline-block; background: var(--accent) !important;
      color: #0f172a !important; font-weight: 700 !important;
      padding: 10px 25px !important; border-radius: 8px !important;
      cursor: pointer; border: none !important;
    }

    .card-tools { display: flex; gap: 10px; }

    .btn-tool {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.2s;
    }

    .btn-tool:hover.edit { color: var(--accent); border-color: var(--accent); }
    .btn-tool:hover.delete { color: var(--danger); border-color: var(--danger); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 2000;
    }

    .modal-card {
      background: #1e293b; border: 1px solid var(--border);
      padding: 30px; border-radius: 16px; width: 90%; max-width: 480px;
      max-height: 90vh; overflow-y: auto;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; color: white; box-sizing: border-box; font-family: inherit;
    }

    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .checkbox-group input { width: auto; cursor: pointer; }

    .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .btn-submit { background: var(--accent); color: #0f172a; border: none; padding: 8px 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }

    @media (max-width: 600px) {
      .book-card { flex-direction: column; }
      .cover-wrapper { width: 100%; height: 220px; }
      .book-meta { flex-direction: column; align-items: flex-start; gap: 10px; }
      .search-box input { width: 140px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand"><i class="fa-solid fa-book-open"></i> flipbookbyalonica</div>
    <div class="nav-actions">
      <div class="search-box">
        <input type="text" id="searchInput" onkeyup="searchBuku()" placeholder="Cari judul/genre...">
      </div>
      <button class="btn-add-book" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Tambah Buku</button>
    </div>
  </nav>

  <!-- Filter Genre Dinamis -->
  <div class="filter-container" id="filterContainer"></div>

  <!-- Grid Catalog Buku -->
  <div class="book-grid" id="bookGrid"></div>

  <!-- Modal Form Pop-up -->
  <div class="modal-overlay" id="bookModal">
    <div class="modal-card">
      <h2 id="modalTitle"><i class="fa-solid fa-plus-circle"></i> Tambah Buku Baru</h2>
      <form id="bookForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group">
          <label>Judul Buku</label>
          <input type="text" id="inputJudul" required placeholder="Contoh: Majalah Vol 1">
        </div>
        <div class="form-group">
          <label>Lokasi File PDF (di folder books/)</label>
          <input type="text" id="inputFile" required placeholder="books/nama-file.pdf">
        </div>
        <div class="form-group">
          <label>Lokasi Gambar Cover (di folder img/)</label>
          <input type="text" id="inputCover" placeholder="img/nama-cover.png">
        </div>
        <div class="form-group">
          <label>Genre / Kategori (Pisahkan koma)</label>
          <input type="text" id="inputGenre" required placeholder="kota, edukasi, populer">
        </div>
        <div class="form-group">
          <label>Sinopsis Singkat</label>
          <textarea id="inputDesc" rows="3" required placeholder="Tuliskan ringkasan cerita atau isi buku di sini..."></textarea>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="inputPopuler">
          <label for="inputPopuler" style="color:var(--gold); font-weight:700; cursor:pointer;">⭐ Tandai sebagai Buku Populer</label>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn-submit">Simpan Buku</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

  <!-- PENAUTAN FILE BUKU.JS DI SINI -->
  <script src="buku.js"></script>

</body>
</html>
