<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpustakaan Flipbook Digital Pro</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #030712;
      --card: #111827;
      --accent: #38bdf8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255,255,255,0.06);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding-top: 80px; /* Jarak untuk navbar */
    }

    /* Navbar Modern */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 1000;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0;
    }

    .search-box input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 30px;
      width: 300px;
    }

    /* Filter Genre */
    .filter-container {
      padding: 20px 5%;
      text-align: center;
      margin-top: 20px;
    }

    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      margin: 5px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #030712;
      font-weight: 600;
    }

    /* Grid Buku Pro */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 30px 5%;
    }

    /* Card Buku dengan Thumbnail */
    .book-card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s;
    }

    .book-card:hover {
      transform: translateY(-8px);
    }

    .cover-wrapper {
      width: 100%;
      height: 380px;
      overflow: hidden;
    }

    .cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .book-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 10px 0;
    }

    .book-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .badge-genre {
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Tombol Baca */
    .book-action ._df_button {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--accent) !important;
      color: #030712 !important;
      font-weight: bold !important;
      padding: 12px !important;
      border-radius: 8px !important;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <h1 class="brand">flipbookbyalonica</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari judul buku atau genre...">
    </div>
  </nav>

  <div class="filter-container">
    <button class="filter-btn active" onclick="filterGenre('all')">Semua</button>
    <button class="filter-btn" onclick="filterGenre('kota')">Kota</button>
    <button class="filter-btn" onclick="filterGenre('majalah')">Majalah</button>
    <button class="filter-btn" onclick="filterGenre('edukasi')">Edukasi</button>
  </div>

  <div class="book-grid" id="bookGrid">
    </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>
  
  <script src="buku.js"></script>

</body>
</html>
