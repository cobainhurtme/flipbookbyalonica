<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Boune City</title>
  
  <!-- CSS Library DFlip -->
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">

  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #1e1e2e; 
      color: #ffffff;
      padding: 20px; 
      margin: 0; 
    }
    h1 { 
      text-align: center; 
      margin-bottom: 30px; 
    }
    .container { 
      max-width: 1000px; 
      margin: 0 auto; 
      background: #2a2a3c; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
    }
  </style>
</head>
<body>

  <h1>Perpustakaan Flipbook</h1>

  <div class="container">
    <h2 style="text-align: center; color: #a6adc8;">Boune City</h2>
    
    <!-- Memanggil file PDF di folder books -->
    <div class="_df_book" id="flipbook1" source="books/Boune City.pdf"></div>
  </div>

  <!-- JS jQuery & DFlip -->
  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

</body>
</html>
