<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Library - Alonica</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- DFlip CSS -->
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 43, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(56, 189, 248, 0.4);
      --accent-cyan: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --gold-star: #fbbf24;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.88) 0%, rgba(9, 13, 22, 0.95) 100%), 
                  url('img/bg-web.png') center/cover fixed no-repeat #090d16;
      color: var(--text-primary);
      margin: 0;
      padding-top: 100px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar Glassmorphism Sleek */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(9, 13, 22, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 6%;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000;
    }

    .brand { 
      font-size: 1.35rem; font-weight: 800; color: #ffffff; 
      display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px;
    }
    
    .brand i { color: var(--accent-cyan); font-size: 1.4rem; filter: drop-shadow(0 0 8px var(--accent-glow)); }

    /* Group Bagian Kanan Navbar */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .search-box { position: relative; display: flex; align-items: center; }
    
    .search-box input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      padding: 9px 18px 9px 40px; border-radius: 30px;
      width: 220px; outline: none; font-size: 0.85rem;
      font-family: inherit; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-box i {
      position: absolute; left: 15px; color: var(--text-secondary); font-size: 0.85rem;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      width: 250px;
    }

    /* User Profile Pill */
    .user-profile-wrapper {
      position: relative;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 14px 5px 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .user-profile:hover, .user-profile.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent-cyan);
    }

    .user-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .user-profile i.fa-chevron-down {
      font-size: 0.75rem;
      color: var(--text-secondary);
      transition: transform 0.3s ease;
    }

    .user-profile.active i.fa-chevron-down {
      transform: rotate(180deg);
    }

    /* Dropdown Profile Menu */
    .profile-dropdown {
      position: absolute;
      top: 52px;
      right: 0;
      width: 260px;
      background: rgba(18, 26, 43, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border-hover);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 1001;
      animation: dropdownFade 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .profile-dropdown.show {
      display: flex;
    }

    @keyframes dropdownFade {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .dropdown-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
    }

    .dropdown-user-info .name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #ffffff;
      margin: 0;
    }

    .dropdown-user-info .role {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      margin: 2px 0 0 0;
      font-weight: 600;
    }

    .dropdown-menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .dropdown-item div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item i {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      width: 18px;
    }

    .dropdown-item:hover {
      background: rgba(56, 189, 248, 0.12);
      color: #ffffff;
      transform: translateX(3px);
    }

    .fav-count-badge {
      background: var(--gold-star);
      color: #090d16;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Filter Bar Pills Modern */
    .filter-container {
      padding: 15px 5% 25px;
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
      max-width: 1000px; margin: 0 auto;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 22px; border-radius: 30px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: capitalize; font-family: inherit;
    }

    .filter-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #090d16; font-weight: 700; 
      border-color: transparent; 
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
    }

    /* Grid Catalog Buku Horizontal */
    .book-grid {
      display: grid; grid-template-columns: 1fr; gap: 30px;
      padding: 10px 5% 60px; max-width: 950px; margin: 0 auto;
    }

    .book-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px; border: 1px solid var(--card-border);
      display: flex; overflow: hidden; position: relative;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .book-card:hover {
      transform: translateY(-5px);
      border-color: var(--card-border-hover);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.12);
    }

    .cover-wrapper {
      width: 210px; height: 290px; flex-shrink: 0; overflow: hidden; position: relative;
    }

    .cover-wrapper img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s ease;
    }

    .book-card:hover .cover-wrapper img {
      transform: scale(1.05);
    }

    .badge-popular {
      position: absolute; top: 14px; left: 14px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #090d16; font-size: 0.68rem; font-weight: 800;
      padding: 5px 12px; border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .book-details {
      padding: 30px 32px; flex-grow: 1;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .book-title { 
      font-size: 1.6rem; font-weight: 800; margin: 0 0 12px 0; 
      color: #ffffff; letter-spacing: -0.5px;
    }

    .book-synopsis {
      color: var(--text-secondary); font-size: 0.92rem; line-height: 1.65; margin: 0 0 20px 0;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      font-weight: 400;
    }

    .book-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 22px; border-top: 1px solid var(--card-border); padding-top: 16px;
    }

    .genre-badges { display: flex; gap: 8px; flex-wrap: wrap; }

    .badge {
      font-size: 0.7rem; font-weight: 700;
      background: rgba(56, 189, 248, 0.12); color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 5px 14px; border-radius: 20px; text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .upload-date { color: var(--text-secondary); font-size: 0.82rem; display: flex; align-items: center; gap: 6px; }

    /* Custom Stylish Button DFlip */
    .book-action ._df_button {
      display: inline-flex !important; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%) !important; 
      color: #090d16 !important; font-weight: 800 !important; font-size: 0.9rem !important;
      padding: 12px 28px !important; border-radius: 14px !important;
      cursor: pointer; border: none !important;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35) !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      font-family: inherit !important; text-transform: none !important;
    }

    .book-action ._df_button:hover {
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.55) !important;
      transform: translateY(-2px) scale(1.02);
      color: #ffffff !important;
    }

    /* FIX FLOATING TOOLBAR DFLIP DI BAWAH */
    .df-lightbox-wrapper,
    .df-lightbox-container,
    .df-container {
      background: rgba(9, 13, 22, 0.94) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
    }

    .df-ui-controls {
      position: absolute !important;
      bottom: 20px !important;
      top: auto !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 99999 !important;

      background: rgba(18, 26, 43, 0.85) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 40px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15) !important;
      height: 48px !important;
      line-height: 48px !important;
      padding: 0 16px !important;
      margin: 0 !important;
      width: fit-content !important;
      min-width: unset !important;
      max-width: 90vw !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .df-ui-controls .df-ui-btn,
    .df-ui-controls .df-ui-prev,
    .df-ui-controls .df-ui-next,
    .df-ui-controls .df-ui-zoom,
    .df-ui-controls .df-ui-page {
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      float: left !important;
      height: 36px !important;
      line-height: 36px !important;
      margin: 0 2px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .df-ui-btn {
      color: var(--text-primary) !important;
      background: transparent !important;
      border-radius: 50% !important;
      width: 36px !important;
      transition: all 0.2s ease !important;
      opacity: 0.8;
    }

    .df-ui-btn:hover {
      color: var(--accent-cyan) !important;
      background: rgba(56, 189, 248, 0.15) !important;
      opacity: 1 !important;
    }

    .df-ui-page-input, .df-ui-page {
      color: var(--accent-cyan) !important;
      font-weight: 700 !important;
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 4px !important;
    }

    @media (max-width: 680px) {
      .navbar { padding: 12px 4%; }
      .book-card { flex-direction: column; }
      .cover-wrapper { width: 100%; height: 250px; }
      .book-meta { flex-direction: column; align-items: flex-start; gap: 14px; }
      .search-box input { width: 130px; }
      .search-box input:focus { width: 150px; }
      .user-name { display: none; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand"><i class="fa-solid fa-book-open"></i> flipbookbyalonica</div>
    
    <div class="nav-right">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" onkeyup="searchBuku()" placeholder="Cari judul...">
      </div>

      <!-- User Profile Dropdown Component -->
      <div class="user-profile-wrapper">
        <div class="user-profile" id="userProfileBtn">
          <img src="img/avatar.png" alt="User Avatar" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Alonica&background=38bdf8&color=090d16'">
          <span class="user-name">Alonica</span>
          <i class="fa-solid fa-chevron-down"></i>
        </div>

        <!-- Menu Dropdown -->
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-header">
            <img src="img/avatar.png" alt="User Avatar" class="dropdown-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Alonica&background=38bdf8&color=090d16'">
            <div class="dropdown-user-info">
              <p class="name">Alonica</p>
              <p class="role"><i class="fa-solid fa-circle-check"></i> VIP Member</p>
            </div>
          </div>

          <ul class="dropdown-menu-list">
            <li class="dropdown-item">
              <div><i class="fa-solid fa-bookmark"></i> Library Saya</div>
            </li>
            <li class="dropdown-item">
              <div><i class="fa-solid fa-star"></i> Buku Favorit</div>
              <span class="fav-count-badge">2</span>
            </li>
            <li class="dropdown-item">
              <div><i class="fa-solid fa-gear"></i> Pengaturan</div>
            </li>
            <li class="dropdown-item" style="color: #ef4444;">
              <div><i class="fa-solid fa-right-from-bracket" style="color: #ef4444;"></i> Keluar</div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Filter Genre Dinamis -->
  <div class="filter-container" id="filterContainer"></div>

  <!-- Grid Catalog Buku -->
  <div class="book-grid" id="bookGrid"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>
  <script src="buku.js"></script>

  <!-- Script untuk Toggle Dropdown Profile -->
  <script>
    const profileBtn = document.getElementById('userProfileBtn');
    const dropdown = document.getElementById('profileDropdown');

    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileBtn.classList.toggle('active');
      dropdown.classList.toggle('show');
    });

    // Tutup dropdown jika klik di luar area profil
    document.addEventListener('click', (e) => {
      if (!profileBtn.contains(e.target) && !dropdown.contains(e.target)) {
        profileBtn.classList.remove('active');
        dropdown.classList.remove('show');
      }
    });
  </script>

</body>
</html>
